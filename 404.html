<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found | Atanu Adhikari</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark light">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<script>
  try { var t = localStorage.getItem('theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<style>
  :root { --bg:#0b0d12; --fg:#e8eaf0; --muted:#9ba1b3; --accent-2:#5eead4; --border:rgba(255,255,255,.18);
          --grad:linear-gradient(90deg,#7c9cff,#5eead4); --focus:#5eead4; }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) { --bg:#f6f7fb; --fg:#11131a; --muted:#464d5f; --accent-2:#0f766e;
          --border:rgba(17,19,26,.22); --grad:linear-gradient(90deg,#3451d1,#0f766e); --focus:#3451d1; }
  }
  :root[data-theme="light"] { --bg:#f6f7fb; --fg:#11131a; --muted:#464d5f; --accent-2:#0f766e;
          --border:rgba(17,19,26,.22); --grad:linear-gradient(90deg,#3451d1,#0f766e); --focus:#3451d1; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { min-height:100%; }
  body { background:var(--bg); color:var(--fg); font-family:Inter,system-ui,sans-serif;
         min-height:100vh; display:grid; place-items:center; padding:24px 16px; text-align:center; }
  main { max-width:560px; }
  .code { font-family:"JetBrains Mono",monospace; font-size:14px; color:var(--accent-2); margin-bottom:16px; }
  h1 { font-size:clamp(56px,16vw,120px); font-weight:800; letter-spacing:-.04em; line-height:1;
       background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent; }
  p.sub { margin-top:16px; font-size:18px; line-height:1.6; color:var(--muted); }
  a.btn { display:inline-flex; align-items:center; min-height:46px; margin-top:32px; padding:10px 20px;
          border-radius:12px; background:linear-gradient(90deg,#7c9cff,#5eead4); color:#0b0d12;
          font-weight:600; text-decoration:none; }
  a:focus-visible { outline:2px solid var(--focus); outline-offset:3px; }
  footer { margin-top:48px; font-family:"JetBrains Mono",monospace; font-size:13px; color:var(--muted); }
  footer a { color:inherit; }
</style>
</head>
<body>
<main>
  <p class="code">error 404</p>
  <h1>Not found</h1>
  <p class="sub">This page doesn't exist, or it moved. The portfolio is one click away.</p>
  <a class="btn" href="/">Back to atanu.online</a>
  <footer>© 2026 Atanu Adhikari · <a href="https://atanu.online/">atanu.online</a></footer>
</main>
</body>
</html>
